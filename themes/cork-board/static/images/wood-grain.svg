<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eec9a0"/>
      <stop offset="1" stop-color="#d2a579"/>
    </linearGradient>
    <filter id="rings" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0.6"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.5"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#shade)"/>
  <rect width="240" height="240" fill="#6e4a2f" opacity="0.15" filter="url(#rings)"/>
</svg>